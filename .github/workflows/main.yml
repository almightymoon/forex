
name: Deploy to Server

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify workflow triggered
        run: |
          echo "Workflow triggered on branch ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.IP }}" ]; then echo "::error::Secret IP is not set"; exit 1; fi
          if [ -z "${{ secrets.USERNAME }}" ]; then echo "::error::Secret USERNAME is not set"; exit 1; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "::error::Secret SSH_PRIVATE_KEY is not set"; exit 1; fi
          echo "All required secrets are present"

      - name: Use nvm with Node.js 20
        uses: actions/setup-node@v3
        with:
          use-nvm: true  # Use nvm to manage Node.js versions
          node-version: 20  # Specify the desired Node.js version

      - name: Install nvm (if needed)
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
          source ~/.bashrc  # Source the .bashrc file after installation

      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -e
            
            # Change directory to project directory
            cd /var/www/forex/
            
            # Configure git to handle divergent branches
            git config pull.rebase false  # Use merge strategy
            
            # Handle local changes that might block git pull
            echo "Checking for local changes..."
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Local changes detected. Discarding changes to package files..."
              # Discard changes to package files (these should come from repo)
              git checkout -- frontend/package.json frontend/package-lock.json backend/package.json backend/package-lock.json 2>/dev/null || true
              # Stash any other changes
              git stash push -m "Pipeline auto-stash before pull" || true
            fi
            
            # Fetch latest changes first
            git fetch origin main
            
            # Reset to match remote if branches have diverged (force update local to match remote)
            echo "Checking for divergent branches..."
            LOCAL=$(git rev-parse @)
            REMOTE=$(git rev-parse @{u})
            BASE=$(git merge-base @ @{u})
            
            if [ "$LOCAL" != "$REMOTE" ] && [ "$LOCAL" != "$BASE" ] && [ "$REMOTE" != "$BASE" ]; then
              echo "Branches have diverged. Resetting local branch to match remote..."
              git reset --hard origin/main
            else
              # Pull latest changes normally
              git pull origin main
            fi
            
            # Install backend dependencies
            cd backend/
            npm ci --production
            cd ..
              
            # Build frontend
            cd frontend/
            # Clean node_modules if it exists to avoid ENOTEMPTY errors
            if [ -d "node_modules" ]; then
              echo "Cleaning existing node_modules..."
              # Remove write protection first
              chmod -R u+w node_modules 2>/dev/null || true
              # Delete using find with exec rm (most reliable)
              find node_modules -type f -exec rm -f {} \; 2>/dev/null || true
              find node_modules -type d -exec rmdir {} \; 2>/dev/null || true
              # Final cleanup attempt
              rm -rf node_modules 2>/dev/null || {
                echo "Warning: Could not fully remove node_modules, but continuing..."
              }
            fi
            # Clean build artifacts and cache
            echo "Cleaning build artifacts..."
            # Remove write protection and delete recursively
            chmod -R u+w .next 2>/dev/null || true
            chmod -R u+w out 2>/dev/null || true
            # Aggressive cleanup: remove entire directories
            if [ -d ".next" ]; then
              echo "Removing .next directory..."
              # Try multiple methods to ensure complete removal
              rm -rf .next/* 2>/dev/null || true
              rm -rf .next/.* 2>/dev/null || true
              find .next -delete 2>/dev/null || true
              rm -rf .next 2>/dev/null || true
            fi
            if [ -d "out" ]; then
              echo "Removing out directory..."
              rm -rf out/* 2>/dev/null || true
              rm -rf out/.* 2>/dev/null || true
              find out -delete 2>/dev/null || true
              rm -rf out 2>/dev/null || true
            fi
            # Verify removal
            if [ -d ".next" ]; then
              echo "ERROR: .next directory still exists after cleanup!"
              ls -la .next 2>/dev/null || true
              exit 1
            else
              echo ".next directory removed successfully"
            fi
            # Clean npm cache and install
            npm cache clean --force || true
            npm ci --production
            # Ensure .next is completely gone before build
            rm -rf .next 2>/dev/null || true
            # Create necessary directories to prevent ENOENT errors
            mkdir -p .next/export .next/server/pages 2>/dev/null || true
            # Run build with clean environment
            NODE_ENV=production npm run build || {
              echo "Build failed, attempting to continue..."
              # If build fails due to file rename issues, try again after cleanup
              rm -rf .next/export 2>/dev/null || true
              NODE_ENV=production npm run build
            }
            cd ..
            
            # Restart services
            cd frontend/
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            cd ..
            
            cd backend/
            pm2 restart backend || pm2 start npm --name "backend" -- start
            cd ..
            
            # Stop MT5 bridge if it is still running from older deploys
            if pm2 list | grep -q "mt5-bridge"; then
              echo "Removing leftover mt5-bridge from PM2..."
              pm2 delete mt5-bridge || true
            fi
            
            pm2 save || echo "Warning: Failed to save PM2 configuration"
            echo "Deployment completed!"
