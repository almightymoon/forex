
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest  # Run the job on the ubuntu-latest runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use nvm with Node.js 20
        uses: actions/setup-node@v3
        with:
          use-nvm: true  # Use nvm to manage Node.js versions
          node-version: 20  # Specify the desired Node.js version

      - name: Install nvm (if needed)
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
          source ~/.bashrc  # Source the .bashrc file after installation

      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -e
            
            # Change directory to project directory
            cd /var/www/forex/
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies
            npm ci --production
            
            # Build frontend
            cd frontend/
            npm ci --production
            npm run build
            cd ..
            
            # Setup MT5 Bridge
            echo "=========================================="
            echo "Setting up MT5 Bridge..."
            echo "=========================================="
            cd mt5-bridge/
            
            # Check if Python 3 is installed
            if ! command -v python3 &> /dev/null; then
              echo "Python 3 not found. Installing..."
              sudo apt-get update -qq
              sudo apt-get install -y python3 python3-pip python3-venv
            else
              echo "Python 3 found: $(python3 --version)"
            fi
            
            # Create virtual environment if it doesn't exist or is incomplete
            if [ ! -d "venv" ] || [ ! -f "venv/bin/activate" ]; then
              echo "Creating Python virtual environment..."
              rm -rf venv
              python3 -m venv venv
            else
              echo "Virtual environment already exists"
            fi
            
            # Activate virtual environment and install dependencies
            echo "Activating virtual environment..."
            source venv/bin/activate || {
              echo "Failed to activate virtual environment. Recreating..."
              rm -rf venv
              python3 -m venv venv
              source venv/bin/activate
            }
            echo "Upgrading pip..."
            pip install --upgrade pip -q
            echo "Installing Python dependencies..."
            pip install -r requirements.txt || {
              echo "Error: Failed to install core dependencies"
              exit 1
            }
            echo "Core Python dependencies installed successfully"
            echo "Note: MetaTrader5 package requires MT5 terminal installation on the server"
            echo "The bridge will run in compatibility mode if MT5 is not available"
            
            # Create .env file if it doesn't exist
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              echo "PORT=8080" > .env
              echo "HOST=0.0.0.0" >> .env
              echo "DEBUG=False" >> .env
            else
              echo ".env file already exists"
            fi
            
            cd ..
            echo "MT5 Bridge setup completed!"
            echo "=========================================="
            
            # Restart services
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            pm2 restart backend || pm2 start npm --name "backend" -- start
            
            # Restart MT5 Bridge
            echo "Restarting MT5 Bridge..."
            cd mt5-bridge/
            # Ensure virtual environment is activated for PM2
            if [ -f "venv/bin/python3" ]; then
              if pm2 list | grep -q "mt5-bridge"; then
                pm2 restart mt5-bridge
              else
                pm2 start venv/bin/python3 --name "mt5-bridge" -- app.py
                pm2 save
              fi
            else
              echo "Warning: Virtual environment not found. Recreating..."
              python3 -m venv venv
              source venv/bin/activate
              pip install --upgrade pip -q
              pip install -r requirements.txt -q
              pm2 start venv/bin/python3 --name "mt5-bridge" -- app.py
              pm2 save
            fi
            cd ..