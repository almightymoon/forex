
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest  # Run the job on the ubuntu-latest runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use nvm with Node.js 20
        uses: actions/setup-node@v3
        with:
          use-nvm: true  # Use nvm to manage Node.js versions
          node-version: 20  # Specify the desired Node.js version

      - name: Install nvm (if needed)
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
          source ~/.bashrc  # Source the .bashrc file after installation

      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -e
            
            # Change directory to project directory
            cd /var/www/forex/
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies
            npm ci --production
            
            # Build frontend
            cd frontend/
            npm ci --production
            npm run build
            cd ..
            
            # Setup MT5 Bridge
            echo "Setting up MT5 Bridge..."
            cd mt5-bridge/
            
            # Check if Python 3 is installed
            if ! command -v python3 &> /dev/null; then
              echo "Installing Python 3..."
              sudo apt-get update
              sudo apt-get install -y python3 python3-pip python3-venv
            fi
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              echo "Creating Python virtual environment..."
              python3 -m venv venv
            fi
            
            # Activate virtual environment and install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Create .env file if it doesn't exist
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              cat > .env << EOF
            PORT=8080
            HOST=0.0.0.0
            DEBUG=False
            EOF
            fi
            
            cd ..
            
            # Restart services
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            pm2 restart backend || pm2 start npm --name "backend" -- start
            
            # Restart MT5 Bridge
            echo "Restarting MT5 Bridge..."
            cd mt5-bridge/
            if pm2 list | grep -q "mt5-bridge"; then
              pm2 restart mt5-bridge
            else
              pm2 start venv/bin/python3 --name "mt5-bridge" -- app.py
              pm2 save
            fi
            cd ..
