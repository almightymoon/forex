name: Deploy
env:
  DEBUG: true

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.IP }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
            
            cd /var/www/forex/
            git pull 
            npm install -f
            cd frontend/
            npm i -f
            npm run build 
            pm2 restart frontend
            pm2 restart backend
            systemctl restart apache2  

            
