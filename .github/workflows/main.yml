
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest  # Run the job on the ubuntu-latest runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use nvm with Node.js 20
        uses: actions/setup-node@v3
        with:
          use-nvm: true  # Use nvm to manage Node.js versions
          node-version: 20  # Specify the desired Node.js version

      - name: Install nvm (if needed)
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
          source ~/.bashrc  # Source the .bashrc file after installation

      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -e
            
            # Change directory to project directory
            cd /var/www/forex/
            
            # Pull latest changes
            git pull origin main
            
            # Install backend dependencies
            cd backend/
            npm ci --production
            cd ..
            
            # Build frontend
            cd frontend/
            # Clean node_modules if it exists to avoid ENOTEMPTY errors
            if [ -d "node_modules" ]; then
              echo "Cleaning existing node_modules..."
              # Remove write protection first
              chmod -R u+w node_modules 2>/dev/null || true
              # Delete using find with exec rm (most reliable)
              find node_modules -type f -exec rm -f {} \; 2>/dev/null || true
              find node_modules -type d -exec rmdir {} \; 2>/dev/null || true
              # Final cleanup attempt
              rm -rf node_modules 2>/dev/null || {
                echo "Warning: Could not fully remove node_modules, but continuing..."
              }
            fi
            # Clean build artifacts and cache
            echo "Cleaning build artifacts..."
            # Remove write protection and delete recursively
            chmod -R u+w .next 2>/dev/null || true
            chmod -R u+w out 2>/dev/null || true
            # Aggressive cleanup: remove entire directories
            if [ -d ".next" ]; then
              echo "Removing .next directory..."
              # Try multiple methods to ensure complete removal
              rm -rf .next/* 2>/dev/null || true
              rm -rf .next/.* 2>/dev/null || true
              find .next -delete 2>/dev/null || true
              rm -rf .next 2>/dev/null || true
            fi
            if [ -d "out" ]; then
              echo "Removing out directory..."
              rm -rf out/* 2>/dev/null || true
              rm -rf out/.* 2>/dev/null || true
              find out -delete 2>/dev/null || true
              rm -rf out 2>/dev/null || true
            fi
            # Verify removal
            if [ -d ".next" ]; then
              echo "ERROR: .next directory still exists after cleanup!"
              ls -la .next 2>/dev/null || true
              exit 1
            else
              echo ".next directory removed successfully"
            fi
            # Clean npm cache and install
            npm cache clean --force || true
            npm ci --production
            # Ensure .next is completely gone before build
            rm -rf .next 2>/dev/null || true
            # Create necessary directories to prevent ENOENT errors
            mkdir -p .next/export .next/server/pages 2>/dev/null || true
            # Run build with clean environment
            NODE_ENV=production npm run build || {
              echo "Build failed, attempting to continue..."
              # If build fails due to file rename issues, try again after cleanup
              rm -rf .next/export 2>/dev/null || true
              NODE_ENV=production npm run build
            }
            cd ..
            
            # Setup MT5 Bridge
            echo "=========================================="
            echo "Setting up MT5 Bridge..."
            echo "=========================================="
            cd backend/mt5-bridge/
            
            # Check if Python 3 is installed
            if ! command -v python3 &> /dev/null; then
              echo "Python 3 not found. Installing..."
              sudo apt-get update -qq
              sudo apt-get install -y python3 python3-pip python3-venv
            else
              echo "Python 3 found: $(python3 --version)"
            fi
            
            # Create virtual environment if it doesn't exist or is incomplete
            if [ ! -d "venv" ] || [ ! -f "venv/bin/activate" ]; then
              echo "Creating Python virtual environment..."
              rm -rf venv
              python3 -m venv venv
            else
              echo "Virtual environment already exists"
            fi
            
            # Activate virtual environment and install dependencies
            echo "Activating virtual environment..."
            source venv/bin/activate || {
              echo "Failed to activate virtual environment. Recreating..."
              rm -rf venv
              python3 -m venv venv
              source venv/bin/activate
            }
            echo "Upgrading pip..."
            pip install --upgrade pip -q
            echo "Installing Python dependencies..."
            pip install -r requirements.txt || {
              echo "Error: Failed to install core dependencies"
              exit 1
            }
            echo "Core Python dependencies installed successfully"
            echo "Note: MetaTrader5 package requires MT5 terminal installation on the server"
            echo "The bridge will run in compatibility mode if MT5 is not available"
            
            # Create .env file if it doesn't exist or verify it has required variables
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              echo "PORT=8080" > .env
              echo "HOST=0.0.0.0" >> .env
              echo "DEBUG=False" >> .env
            else
              echo ".env file already exists"
              # Verify required variables exist
              if ! grep -q "PORT=" .env; then
                echo "PORT=8080" >> .env
              fi
              if ! grep -q "HOST=" .env; then
                echo "HOST=0.0.0.0" >> .env
              fi
              if ! grep -q "DEBUG=" .env; then
                echo "DEBUG=False" >> .env
              fi
            fi
            echo "Verifying .env file contents:"
            cat .env
            
            cd ../..
            echo "MT5 Bridge setup completed!"
            echo "=========================================="
            
            # Restart services
            cd frontend/
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            cd ..
            
            cd backend/
            pm2 restart backend || pm2 start npm --name "backend" -- start
            cd ..
            
            # Restart MT5 Bridge
            echo "=========================================="
            echo "Restarting MT5 Bridge..."
            echo "=========================================="
            cd backend/mt5-bridge/
            
            # Create logs directory if it doesn't exist
            mkdir -p logs
            
            # Ensure virtual environment exists and is valid
            if [ ! -f "venv/bin/python3" ]; then
              echo "Warning: Virtual environment not found. Recreating..."
              rm -rf venv
              python3 -m venv venv
              source venv/bin/activate
              pip install --upgrade pip -q
              pip install -r requirements.txt -q
            fi
            
            # Verify Python interpreter exists
            if [ ! -f "venv/bin/python3" ]; then
              echo "ERROR: Python interpreter not found in venv!"
              exit 1
            fi
            
            # Get absolute path
            BRIDGE_DIR=$(pwd)
            echo "Bridge directory: $BRIDGE_DIR"
            
            # Check if bridge is already running
            if pm2 list | grep -q "mt5-bridge"; then
              echo "MT5 Bridge found in PM2. Stopping and removing..."
              pm2 delete mt5-bridge || true
              sleep 1
            fi
            
            echo "Starting MT5 Bridge with PM2..."
            # Update PM2 config with correct path
            cd "$BRIDGE_DIR"
            # Use PM2 config file if it exists, otherwise use command line
            if [ -f "pm2.config.js" ]; then
              # Update cwd in config if needed (sed replacement)
              sed -i "s|/var/www/forex/mt5-bridge|$BRIDGE_DIR|g" pm2.config.js || true
              pm2 start pm2.config.js
            else
              # Fallback to command line start
              PORT=8080 HOST=0.0.0.0 DEBUG=False pm2 start "$BRIDGE_DIR/venv/bin/python3" --name "mt5-bridge" -- "$BRIDGE_DIR/app.py"
            fi
            sleep 3
            
            # Verify bridge started successfully
            if pm2 list | grep -q "mt5-bridge"; then
              BRIDGE_STATUS=$(pm2 jlist | python3 -c "import sys, json; data=json.load(sys.stdin); bridge=[x for x in data if x['name']=='mt5-bridge']; print(bridge[0]['pm2_env']['status'] if bridge else 'not found')" 2>/dev/null || echo "unknown")
              echo "MT5 Bridge PM2 Status: $BRIDGE_STATUS"
              
              if [ "$BRIDGE_STATUS" != "online" ]; then
                echo "WARNING: MT5 Bridge status is not 'online'. Checking logs..."
                pm2 logs mt5-bridge --lines 20 --nostream || true
              else
                echo "✓ MT5 Bridge is running successfully"
              fi
            else
              echo "ERROR: Failed to start MT5 Bridge in PM2"
              pm2 logs mt5-bridge --lines 50 --nostream || true
              exit 1
            fi
            
            # Save PM2 configuration
            pm2 save || echo "Warning: Failed to save PM2 configuration"
            
            # Test bridge health endpoint
            echo "Testing bridge health endpoint..."
            sleep 3
            curl -f http://localhost:8080/health || echo "WARNING: Bridge health check failed (this might be normal if bridge is still starting)"
            
            cd ..
            echo "MT5 Bridge deployment completed!"
            echo "=========================================="
